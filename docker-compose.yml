version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: laravel-app
        container_name: laravel-app-theway
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
        environment:
            - COMPOSER_HOME=/composer
            - COMPOSER_ALLOW_SUPERUSER=1
            - APP_ENV=local
            - APP_KEY=base64:V9lMOMKFhL7IdZ9/3KcjtT24SIqRw+Oz7ObmYy9YvJQ=
        depends_on:
            - redis
            - mailpit

    nginx:
        image: nginx:alpine
        container_name: webserver-theway
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    db:
        image: postgres:alpine
        container_name: postgres-theway
        restart: unless-stopped
        environment:
            POSTGRES_USER: pguser
            POSTGRES_PASSWORD: pgpassword
            POSTGRES_DB: pgdatabase
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    redis:
        image: redis:alpine
        container_name: redis-theway
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

    mailpit:
        image: axllent/mailpit
        container_name: mailpit-theway
        ports:
            - "8025:8025"

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
